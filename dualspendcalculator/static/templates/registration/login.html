{% extends "base.html" %}

{% block title %}ログイン - 生活費精算{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-title">ログイン</h1>
            <p class="login-subtitle">生活費精算アプリへようこそ</p>
        </div>
        
        <form method="post" class="login-form">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="error-message">
                <span>ユーザー名またはパスワードが正しくありません</span>
            </div>
            {% endif %}
            
            <div class="form-group">
                <label for="id_username" class="form-label">ユーザー名</label>
                <input type="text" 
                       name="username" 
                       id="id_username" 
                       class="form-input {% if form.errors %}input-error{% endif %}"
                       placeholder="ユーザー名を入力"
                       autocomplete="username"
                       autofocus
                       required>
            </div>
            
            <div class="form-group">
                <label for="id_password" class="form-label">パスワード</label>
                <input type="password" 
                       name="password" 
                       id="id_password" 
                       class="form-input {% if form.errors %}input-error{% endif %}"
                       placeholder="パスワードを入力"
                       autocomplete="current-password"
                       required>
            </div>
            
            <button type="submit" class="btn-login">
                ログイン
            </button>
        </form>
    </div>
</div>
{% endblock %}
