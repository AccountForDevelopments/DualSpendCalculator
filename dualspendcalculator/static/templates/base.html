{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}生活費精算{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="{% url 'dashboard' %}" class="header-logo">
                <span class="logo-text">生活費精算</span>
            </a>
            {% if user.is_authenticated %}
            <nav class="header-nav">
                <span class="nav-user">
                    <span class="user-name">{{ user.username }}</span>
                </span>
                <form method="post" action="{% url 'logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">ログアウト</button>
                </form>
            </nav>
            {% endif %}
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p class="copyright">&copy; 2025 生活費精算アプリ</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
