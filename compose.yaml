services:
  db:
    image: postgres:16-alpine
    container_name: dualspendcalculator_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dualspendcalculator}
      POSTGRES_USER: ${POSTGRES_USER:-dualspendcalculator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dualspendcalculator}
    volumes:
      - dualspendcalculator_postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
    container_name: dualspendcalculator_web
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./dualspendcalculator:/app/dualspendcalculator
    ports:
      - "${HOST_WEB_PORT:-8000}:8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

volumes:
  dualspendcalculator_postgres_data:

